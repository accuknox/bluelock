apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: bluelock-file-pattern-owneronly
  namespace: container_namespace
spec:
  selector:
    matchLabels:
      kubearmor.io/container.name: armored-container
  file:
    matchPatterns:
    - pattern: ".*\\.tmp$"
      ownerOnly: true
  action: Block
