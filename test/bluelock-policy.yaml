apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: bluelock-block-open-policy
spec:
  severity: 10
  message: "a critical file was accessed"
  tags:
  - WARNING
  selector:
    matchLabels:
      kubearmor.io/container.name: armored-container
        #process:
        #  matchPaths:
        #    - path: /usr/bin/ls
        #      #- path: /usr/bin/cat
  file:
    matchPaths:
    - path: /file0.txt
      fromSource:
        - path: /usr/bin/rm
  action:
    Block
