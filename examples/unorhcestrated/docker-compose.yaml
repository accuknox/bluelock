version: '3.8'
volumes:
  kubearmor-dir: {}
networks:
  bluelock-test-net: {}
services:
  # we only use this to copy kubearmor binary to a shared vol
  bluelock:
    container_name: bluelock
    build:
      context: .
    image: public.ecr.aws/k9v9d5v2/accuknox-bluelock:v1.0.0
    volumes:
      - kubearmor-dir:/kubearmor

  # relay server
  kubearmor-relay-server:
    container_name: kubearmor-relay-server
    image: kubearmor/kubearmor-relay-server:latest
    command: ["-k8s=false"]
    networks:
      - bluelock-test-net
    ports:
      # gRPC port for relay
      # clients and kubearmor both connect to this
      - "32767:32767"

  # application container
  armored-container:
    container_name: armored-container
    build:
      context: ./test
    depends_on:
      - bluelock
    image: public.ecr.aws/k9v9d5v2/accuknox-bluelock/ka-socat-demo:latest
    entrypoint:
      - "/kubearmor/bluelock"
    command:
      - "socat"
      - "TCP-LISTEN:1337,reuseaddr,fork"
      - "EXEC:bash,pty,stderr,setsid,sigint,sane"
    volumes:
      - kubearmor-dir:/kubearmor
    networks:
      - bluelock-test-net
    ports:
      # reverse shell for testing
      - "1337:1337"
    environment:
      - RELAYSERVERURL=http://kubearmor-relay-server:32767
      - K8S=false
      - CONTAINERNAME=armored-container
