name: Build and Push Bluelock

on:
  push:
    tags:
      - "v*"

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 956994857092.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_NAME: accuknox-bluelock

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify workspace
        run: |
          pwd
          ls -lah
          find . -name bluelock

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$IMAGE_NAME:${{ github.ref_name }} \
            -t $ECR_REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.ref_name }}
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest