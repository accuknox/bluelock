
name: bluelock Workflow

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-*"
    - "v*"
  pull_request_target:
    branches:
    - "*"


env:
  REPO: 956994857092.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_NAME: accuknox-bluelock
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEV_ACCESS_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEV_SECRET_ID }}
  SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
  AWS_REGION: us-east-2

jobs:
  tag-validate:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: rubenesp87/semver-validation-action@0.1.0
      with:
       version: ${{ github.ref_name }}

  docker-image-scan:
    runs-on:  ubuntu-latest
    needs: [tag-validate]
    if: always() && !contains(needs.tag-validate.result, 'failure') && !contains(needs.go.result, 'failure')
    steps:
    - name: Checkout source
      uses: accuknox/common-gh-actions/actions/checkout-source@main
    - name: Set git ssh private key
      run: echo "${{ secrets.GIT_KEY }}" > GIT-KEY
    - name: Debug workspace
      run: |
        pwd
        ls -lah
        find . -name bluelock
    - name: Docker build
      uses: accuknox/common-gh-actions/actions/docker-scan@main
      with:
        repository_name: ${{ env.REPO }}
        image_name: ${{ env.IMAGE_NAME }}
        tag: ${{ github.ref_name }}
        label: "DGFD"
        cspm_endpoint: "cspm.accuknox.com"
        cspm_token: ${{ secrets.AK_PROD_ACCUKNOXTECH_TOKEN }}
        tenant_id: ${{ secrets.AK_PROD_ACCUKNOXTECH_TENANT_ID }}
        disable_scan: false

  docker-image-push:
    runs-on:  ubuntu-latest
    if: (success() || failure()) && startsWith(github.ref, 'refs/tags/v')
    needs: [docker-image-scan]
    steps:
    - name: Checkout source
      uses: accuknox/common-gh-actions/actions/checkout-source@main
    - name: Docker build and Push image to ECR
      uses: accuknox/common-gh-actions/actions/docker-push@main
      with:
        repo: ${{ env.REPO }}
        image-name: ${{ env.IMAGE_NAME }}
        tag: ${{ github.ref_name }}